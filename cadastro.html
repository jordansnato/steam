    <main>
        <h2>Cadastre-se</h2>
        <section>
            <input type="text" name="name" id="name" placeholder="Seu nome completo..">
            <input type="email" name="email" id="email" placeholder="Digite seu melhor email..">
            <input type="tel" name="telefone" id="telefone" placeholder="(00)00000-0000">
            <input type="number" name="cpf" id="cpf" placeholder="000.000.000-00">
            <input type="password" name="senha" id="senha" placeholder="Sua senha">
        </section>
        <div class="div-btn">
            <button class="btn">Cadastrar</button>
        </div>
    </main>
