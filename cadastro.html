<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se cadastre-se</title>
    <link rel="stylesheet" href="./css/cadastro.css">
</head>

<body>
    <header>
        <img src="./assets/header_logo.jpeg" alt="logo steam" />
        <nav>
            <a href="index.html">Inicio</a>
            <a href="jogos.html">Jogos</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <form action="index.html" method="get">
            <fieldset>
                <legend>Dados pessoais</legend>
                <div class="campos">
                    <label for="name">Nome completo*</label>
                    <input type="text" name="name" id="name" required placeholder="Seu nome completo" minlength="3">

                    <label for="email">Email*</label>
                    <input type="email" name="email" id="email" required placeholder="Seu melhor email">

                    <label for="cpf">CPF*</label>
                    <input type="text" name="cpf" id="cpf" required placeholder="000.000.000-00" maxlength="14"
                        pattern="\d{3}\.\d{3}\.\d{3}-\d{2}">

                    <label for="telefone">Telefone*</label>
                    <input type="tel" name="telefone" id="telefone" required placeholder="(xx) xxxxx-xxxx"
                        maxlength="15" pattern="\(\d{2}\)\d{5}-\d{4}">

                    <label for="senha">Senha*</label>
                    <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required
                        minlength="6">
                </div>
            </fieldset>
            <div class="div-btn">
                <button class="btn">Cadastrar</button>
            </div>
        </form>
    </main>

    <footer>
        <div class="footer-end">
            <div class="footer-grid">
                <h3>Steam</h3>
                <p>Sua loja de Jogos com os melhores produtos e preços.</p>
            </div>
            <div class="footer-grid">
                <div class="footer-col">
                    <h3>Links</h3>
                    <a href="index.html">Inicio</a>
                    <a href="jogos.html">Jogos</a>
                    <a href="sobre.html">Sobre</a>
                    <a href="contato">Contato</a>
                </div>
            </div>
            <div class="footer-grid">
                <div class="footer-col">
                    <h3>Atendimento</h3>
                    <a href="tel:+554799990000">(47) 9999-0000</a>
                    <a href="malito:jordansnatos@gmail.com">jordansnatos@gmail.com</a>
                </div>
            </div>
        </div>
        <hr>
        <p>&copy; Steam jogos - 2026 - Senai </p>
    </footer>
</body>

</html>
